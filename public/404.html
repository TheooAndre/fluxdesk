<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090e19" />
    <meta name="robots" content="noindex" />
    <title>Page not found | FluxDesk</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #090e19; color: #e8f1ff; }
      main { min-height: 100vh; display: grid; place-content: center; gap: 12px; padding: 32px; }
      small { color: #6de6be; font-weight: 700; letter-spacing: .12em; }
      h1 { margin: 0; font-size: clamp(30px, 6vw, 52px); letter-spacing: -.04em; }
      p { margin: 0; color: #a8bdd2; line-height: 1.6; }
      a { width: fit-content; margin-top: 8px; color: #090e19; background: #6de6be; border-radius: 8px; padding: 10px 14px; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <small>FLUXDESK · 404</small>
      <h1>Page not found</h1>
      <p>The requested page does not exist.</p>
      <a href="/">Return to FluxDesk</a>
    </main>
  </body>
</html>
