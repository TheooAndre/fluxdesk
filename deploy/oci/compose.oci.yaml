# Compose overlay for Oracle Cloud Always Free, Ubuntu 24.04 Arm64.
# Requires a SEPARATE ext4/xfs OCI block volume mounted at /srv/fluxdesk.
# Apply WITH deploy/vps/compose.yaml; never run this override alone.
#
# Docker's named volume points at a host directory on the attached OCI disk.
# This keeps historical datasets separate from the VM boot volume, and makes
# the existing backup.sh operate on the same named volume without changes.
#
# DO NOT create this volume on an ephemeral /srv directory. Run
# deploy/oci/verify-host.sh before the very first docker compose up.
# An OCI-specific disk identity is verified inside the API container on EVERY
# startup, catching a reboot race if a host bind inadvertently falls back
# to a directory on the VM boot disk.
services:
  api:
    environment:
      FLUXDESK_DATA_VOLUME_ID: ${FLUXDESK_DATA_VOLUME_ID:?Set the OCI block disk identity in deploy/vps/.env}
volumes:
  research-data:
    name: fluxdesk_backend_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/fluxdesk/data
