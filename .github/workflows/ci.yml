name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:smoke
      - run: pnpm build
      - name: Bundle budget (200KB gzipped per initial chunk)
        run: |
          node - <<'JS'
          const fs=require('fs'),path=require('path'),zlib=require('zlib');
          const files=fs.readdirSync('dist/assets').filter(x=>x.endsWith('.js'));
          for(const file of files){const gz=zlib.gzipSync(fs.readFileSync(path.join('dist/assets',file))).length;if(gz>200_000){console.error(`${file} gz=${gz} over budget`);process.exitCode=1}}
          JS
      # Deployment requires an authenticated HTTPS production domain and user secrets.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: E2E browser and mobile flows (mocked market APIs)
        run: pnpm e2e
      - name: Preserve Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Lighthouse mobile PWA shell gates (mock data not validated here)
        run: pnpm lighthouse
      - name: Preserve Lighthouse reports for failed audits
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: lighthouse-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high
