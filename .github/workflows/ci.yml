name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    # Playwright 1.56.1 has browser binaries for Ubuntu 24.04, not 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:smoke
      - run: pnpm build
      - name: Validate portable VPS deployment manifest (no containers created)
        run: |
          docker compose --env-file deploy/vps/.env.example -f deploy/vps/compose.yaml config --quiet
          docker compose --env-file deploy/vps/.env.example -f deploy/vps/compose.yaml -f deploy/oci/compose.oci.yaml config --quiet
          bash -n deploy/vps/backup.sh
          bash -n deploy/oci/verify-host.sh
      - name: Build backend container and verify missing-volume startup fails closed
        run: |
          docker build --pull -t fluxdesk-api:ci .
          set +e
          timeout 25s docker run --rm \
            -e FLUXDESK_GATEWAY_TOKEN=ci-only-strong-gateway-secret-1234567890 \
            fluxdesk-api:ci > /tmp/fluxdesk-container-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo 'Container unexpectedly started without a persistent volume' >&2
            exit 1
          fi
          if ! grep -q 'Persistent volume missing at DATA_DIR' /tmp/fluxdesk-container-smoke.log; then
            echo 'Container failed for a reason other than the expected volume safety check' >&2
            cat /tmp/fluxdesk-container-smoke.log >&2
            exit 1
          fi
      - name: Smoke-test 256MiB Sandbox API authorization and disk persistence
        run: bash scripts/cloud-runtime-smoke.sh fluxdesk-api:ci
      - name: Bundle budget (200KB gzipped per initial chunk)
        run: |
          node - <<'JS'
          const fs=require('fs'),path=require('path'),zlib=require('zlib');
          const files=fs.readdirSync('dist/assets').filter(x=>x.endsWith('.js'));
          for(const file of files){const gz=zlib.gzipSync(fs.readFileSync(path.join('dist/assets',file))).length;if(gz>200_000){console.error(`${file} gz=${gz} over budget`);process.exitCode=1}}
          JS
      # Deployment requires an authenticated HTTPS production domain and user secrets.
      - name: Install Playwright system dependencies
        timeout-minutes: 5
        run: |
          set -o pipefail
          pnpm exec playwright install-deps chromium firefox webkit 2>&1 | tee /tmp/fluxdesk-browser-deps.log
      - name: Install Playwright browsers
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: |
          set -o pipefail
          for attempt in 1 2; do
            if timeout --kill-after=10s 120s pnpm exec playwright install chromium firefox webkit 2>&1 | tee -a /tmp/fluxdesk-browser-download.log; then
              exit 0
            fi
          done
          exit 1
      - name: Preserve browser setup logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-setup-logs
          path: /tmp/fluxdesk-browser-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: E2E browser and mobile flows (mocked market APIs)
        run: pnpm e2e
      - name: Production HTML hydration and chart startup
        run: pnpm exec playwright test --config playwright.production.config.ts
      - name: Preserve Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Lighthouse mobile PWA shell gates (mock data not validated here)
        run: pnpm lighthouse
      - name: Preserve Lighthouse reports for failed audits
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: lighthouse-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high
