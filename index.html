<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#090e19"/>
    <meta name="description" content="A personal crypto relative strength and market structure dashboard"/>
    <link rel="icon" href="/icons/icon-192.png"/>
    <title>FluxDesk | Crypto intelligence</title>
    <style>
      /* Immediately paint useful application context while the JavaScript app boots. */
      #root:empty{min-height:100vh;background:#090e19}
      .initial-shell{box-sizing:border-box;min-height:100vh;padding:90px max(20px,5vw);background:#090e19;color:#e8f1ff;font-family:system-ui,-apple-system,sans-serif}
      .initial-shell h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.03em;margin:10px 0}
      .initial-shell p{font-size:16px;color:#a8bdd2;line-height:1.55;max-width:600px;margin:0}
      .initial-shell small{font-size:12px;font-weight:700;letter-spacing:.1em;color:#6de6be}
    </style>
  </head>
  <body>
    <!--app-shell-start-->
    <div id="root">
      <main class="initial-shell" aria-label="FluxDesk loading">
        <small>QUANT MARKET TERMINAL</small>
        <h1>Market overview</h1>
        <p>Exchange snapshots, relative strength and structured research.</p>
      </main>
    </div>
    <!--app-shell-end-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
